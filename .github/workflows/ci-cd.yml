name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      rehearsal_network:
        description: 'Network to run the mainnet rehearsal against'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - futurenet
      rehearsal_confirm:
        description: 'Type "rehearse" to confirm running the deploy/pause/upgrade drills'
        required: true
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ========== SHELL SCRIPTS ==========
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck scripts/deploy-contract.sh scripts/deploy-frontend.sh scripts/init-contract.sh scripts/seed-data.sh

  # ========== SMART CONTRACT ==========
  contract-check:
    name: Contract Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/ai-agent-marketplace
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
          
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Check formatting
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Build
        run: cargo build --target wasm32-unknown-unknown --release
        
      - name: Test
        run: cargo test --all

      # Explicitly re-run the security-critical suites so a regression in the
      # denylist or pause/upgrade guards fails the build even if test filtering
      # elsewhere changes. These cover the mainnet release blockers.
      - name: Test denylist & pause/upgrade guards
        run: |
          cargo test --all denylist
          cargo test --all pause
          cargo test --all upgrade

      # Fails if any entrypoint exceeds 70% of the mainnet CPU or memory
      # limits (see docs/BUDGETS.md).
      - name: Budget regression check
        run: cargo test --all budget -- --nocapture

  contract-optimize:
    name: Optimize WASM
    needs: contract-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/ai-agent-marketplace
    steps:
      - uses: actions/checkout@v4
      
      # Pinned toolchain for a reproducible release build. Keep in sync with
      # the "Verifying the Deployed Contract" section of the README.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.81.0
        with:
          target: wasm32-unknown-unknown
          
      - name: Build release
        run: |
          RUSTFLAGS="-D warnings --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/build" cargo build --locked --target wasm32-unknown-unknown --release
        
      - name: Install wasm-opt
        run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_115/binaryen-version_115-x86_64-linux.tar.gz | tar -xz
          echo "$(pwd)/binaryen/bin" >> $GITHUB_PATH
          
      - name: Optimize WASM
        run: |
          wasm-opt -Oz \
            target/wasm32-unknown-unknown/release/ai_agent_marketplace.wasm \
            -o target/wasm32-unknown-unknown/release/ai_agent_marketplace.opt.wasm

      - name: Compute WASM hash
        run: |
          cd target/wasm32-unknown-unknown/release
          sha256sum ai_agent_marketplace.opt.wasm | tee ai_agent_marketplace.opt.wasm.sha256
            
      - name: Check size
        run: |
          SIZE=$(wc -c < target/wasm32-unknown-unknown/release/ai_agent_marketplace.opt.wasm)
          echo "WASM size: $((SIZE / 1024)) KB"
          if [ $SIZE -gt 1000000 ]; then
            echo "::warning::WASM exceeds 1MB"
          fi
          
      # deploy-contract.sh verifies mainnet builds against this hash
      # (EXPECTED_WASM_HASH).
      - name: Record WASM hash
        run: |
          cd target/wasm32-unknown-unknown/release
          sha256sum ai_agent_marketplace.opt.wasm | tee ai_agent_marketplace.opt.wasm.sha256

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            contracts/ai-agent-marketplace/target/wasm32-unknown-unknown/release/ai_agent_marketplace.opt.wasm
            contracts/ai-agent-marketplace/target/wasm32-unknown-unknown/release/ai_agent_marketplace.opt.wasm.sha256
          retention-days: 7

  # ========== FRONTEND ==========
  frontend-lint:
    name: Frontend Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ai-agent-marketplace
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install pnpm
        run: corepack enable pnpm
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: TypeCheck
        run: pnpm tsc --noEmit
        
      - name: Lint
        run: pnpm lint
        
      - name: Test
        run: pnpm test --run

  frontend-build:
    name: Build Frontend
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ai-agent-marketplace
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install pnpm
        run: corepack enable pnpm
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build
        run: pnpm build
        env:
          VITE_CONTRACT_ID: ${{ secrets.VITE_CONTRACT_ID }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_NETWORK_PASSPHRASE: ${{ secrets.VITE_NETWORK_PASSPHRASE }}
          VITE_USDC_CONTRACT_ID: ${{ secrets.VITE_USDC_CONTRACT_ID }}
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ========== END-TO-END TESTS ==========
  # Runs Playwright against the Vite dev server. It is intentionally NOT gated
  # on `frontend-build`/`frontend-lint`: the e2e suite drives the dev server
  # rather than the production build artifact, so it can run independently and
  # still validate the core user flows.
  #
  # Spec coverage:
  #   landing.spec.ts       - hero section and CTA navigation
  #   marketplace.spec.ts   - agent cards, job tabs, search filtering
  #   wallet-gate.spec.ts   - unauthenticated route guards
  #   agent-profile.spec.ts - /agent/:id profile rendering
  #   navigation.spec.ts    - smoke tests for all top-level routes
  frontend-e2e:
    name: Frontend E2E (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ai-agent-marketplace
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/ai-agent-marketplace/playwright-report/
          retention-days: 7

  # ========== MAINNET RELEASE REHEARSAL ==========
  # Manual-only job that runs the full mainnet release checklist against a
  # non-production network (testnet by default): deploy, initialize with the
  # multisig admin and caps, pause drill, upgrade drill and state
  # reconciliation. The generated rehearsal report is uploaded as an artifact
  # and must be reviewed/merged before the first mainnet deploy.
  rehearsal:
    name: Mainnet Rehearsal (${{ inputs.rehearsal_network }})
    if: github.event_name == 'workflow_dispatch' && inputs.rehearsal_confirm == 'rehearse'
    runs-on: ubuntu-latest
    environment: rehearsal
    defaults:
      run:
        working-directory: contracts/ai-agent-marketplace
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/raw/main/install.sh | bash -s -- --version 21.0.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prepare rehearsal workspace
        run: mkdir -p rehearsal-report

      - name: Deploy & initialize (multisig admin, caps)
        env:
          NETWORK: ${{ inputs.rehearsal_network }}
          STELLAR_SECRET_KEY: ${{ secrets.REHEARSAL_SECRET_KEY }}
          ADMIN_MULTISIG: ${{ secrets.REHEARSAL_ADMIN_MULTISIG }}
          WASM_PATH: target/wasm32-unknown-unknown/release/ai_agent_marketplace.wasm
        run: |
          ./scripts/rehearsal/deploy.sh 2>&1 | tee rehearsal-report/01-deploy.log

      - name: Pause drill
        env:
          NETWORK: ${{ inputs.rehearsal_network }}
          STELLAR_SECRET_KEY: ${{ secrets.REHEARSAL_SECRET_KEY }}
        run: |
          ./scripts/rehearsal/pause-drill.sh 2>&1 | tee rehearsal-report/02-pause-drill.log

      - name: Upgrade drill
        env:
          NETWORK: ${{ inputs.rehearsal_network }}
          STELLAR_SECRET_KEY: ${{ secrets.REHEARSAL_SECRET_KEY }}
          WASM_PATH: target/wasm32-unknown-unknown/release/ai_agent_marketplace.wasm
        run: |
          ./scripts/rehearsal/upgrade-drill.sh 2>&1 | tee rehearsal-report/03-upgrade-drill.log

      - name: Reconciliation
        env:
          NETWORK: ${{ inputs.rehearsal_network }}
        run: |
          ./scripts/rehearsal/reconcile.sh 2>&1 | tee rehearsal-report/04-reconcile.log

      - name: Assemble rehearsal report
        if: always()
        run: |
          {
            echo "# Mainnet Rehearsal Report"
            echo ""
            echo "- Network: ${{ inputs.rehearsal_network }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Result: ${{ job.status }}"
            echo ""
            for f in rehearsal-report/*.log; do
              [ -f "$f" ] || continue
              echo "## $(basename "$f")"
              echo '```'
              cat "$f"
              echo '```'
              echo ""
            done
          } > rehearsal-report/REHEARSAL_REPORT.md

      - name: Upload rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-report-${{ inputs.rehearsal_network }}
          path: contracts/ai-agent-marketplace/rehearsal-report/
          retention-days: 30

  # ========== DEPLOY ==========
  deploy-preview:
    name: Deploy Preview
    needs: [contract-optimize, frontend-build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
        env:
          VITE_CONTRACT_ID: ${{ secrets.VITE_CONTRACT_ID }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_NETWORK_PASSPHRASE: ${{ secrets.VITE_NETWORK_PASSPHRASE }}
          VITE_USDC_CONTRACT_ID: ${{ secrets.VITE_USDC_CONTRACT_ID }}

  # Secrets below resolve from the job's GitHub Environment, so `testnet` and
  # `mainnet` each hold their own VERCEL_* / VITE_* values. The `mainnet`
  # environment is configured with required reviewers, so its job waits for
  # manual approval; `testnet` has no protection rules and deploys
  # automatically.
  deploy-testnet:
    name: Deploy Testnet
    needs: [contract-optimize, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VITE_CONTRACT_ID: ${{ secrets.VITE_CONTRACT_ID }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_NETWORK_PASSPHRASE: ${{ secrets.VITE_NETWORK_PASSPHRASE }}
          VITE_USDC_CONTRACT_ID: ${{ secrets.VITE_USDC_CONTRACT_ID }}

  deploy-mainnet:
    name: Deploy Mainnet
    needs: [contract-optimize, deploy-testnet]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VITE_CONTRACT_ID: ${{ secrets.VITE_CONTRACT_ID }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_NETWORK_PASSPHRASE: ${{ secrets.VITE_NETWORK_PASSPHRASE }}
          VITE_USDC_CONTRACT_ID: ${{ secrets.VITE_USDC_CONTRACT_ID }}
          
      - name: Download contract WASM
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: contract-wasm

      - name: Read WASM hash
        id: wasm
        run: echo "sha256=$(cut -d' ' -f1 contract-wasm/ai_agent_marketplace.opt.wasm.sha256)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            **Contract WASM SHA-256:** `${{ steps.wasm.outputs.sha256 }}`

            Built in CI with Rust 1.81.0 and binaryen version_115. See the README section "Verifying the Deployed Contract" to reproduce and compare against the on-chain contract.
          files: |
            contract-wasm/ai_agent_marketplace.opt.wasm
            contract-wasm/ai_agent_marketplace.opt.wasm.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}